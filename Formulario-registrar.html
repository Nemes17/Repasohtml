<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <link rel="stylesheet" href="/estilos/Estyles.css">
</head>
<body class="cuerpo"> 
    <article>
        <div class="forma1">
            <h1>Registrate</h1>
            <br>
            <hr>
            <form action="Formulario-iniciar-sesion.html" method="get">
                <div>
                    <label for="nombre">Nombre</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ingresa Nombre" required>
                </div>
                <hr>
                <div>
                    <label for="">Apellido</label>
                    <input type="text" id="Apellido" placeholder="ingresa Apellido" >
                </div>
                <hr>
                <div>
                    <label for=""> Correo Eletronico</label>
                    <input type="email" id="Email" placeholder="Ingresa correo"  required>
                </div>
                <hr>
                <div>
                    <label for="">Edad</label>
                    <input type="number" min="1" max="50" required>
                </div>
                <hr>
                <div>
                    <input type="radio"> Masculino
                    <input type="radio"> Femenino
                    <input type="checkbox"> Otro
                </div>
                <hr>
                <div>
                    <input type="date"> Fecha de Nacimiento
                </div>
                <hr>
                <div>
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>
    </article>
</body>
</html>
